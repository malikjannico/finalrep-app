<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="finalrep_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>finalrep_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Custom startup loading screen styles */
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    .logo-container {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .brand-logo {
      width: 80px;
      height: auto;
      filter: drop-shadow(0 2px 8px rgba(233, 78, 27, 0.3));
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(233, 78, 27, 0.1);
      border-radius: 50%;
      border-top-color: #E94E1B;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 24px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      opacity: 0.8;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-container">
      <img src="favicon.svg" alt="FinalRep Logo" class="brand-logo" />
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Loading FinalRep App...</div>
  </div>
  <script>
    // Suppress deprecated Intl.v8BreakIterator warning by deleting it,
    // which forces the engine to use standard Intl.Segmenter.
    if (typeof Intl !== 'undefined' && Intl.v8BreakIterator) {
      delete Intl.v8BreakIterator;
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
